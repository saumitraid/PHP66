<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<meta name="Description" content="Enter your description here"/>
<link rel="stylesheet" href="css/bootstrap.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<title>Login</title>
</head>
<body>
    <div class="container">
        <div class="col-6">
            <h1>User Login</h1>
            <form name="frm">
                <div class="mb-3">
                    <label for="email" class="form-label">Enter Email</label>
                    <input class="form-control border-primary" type="email" name="email" id="email">
                </div>
                <div class="mb-3">
                    <label for="pwd" class="form-label">Enter Password</label>
                    <input class="form-control border-primary" type="password" id="pwd" name="pwd">
                </div>
                <input class="btn btn-outline-primary" type="submit" name="btn" value="Login">
            </form>
        </div>
    </div>
<script src="js/popper.min.js"></script>
<script src="js/bootstrap.min.js"></script>
</body>
</html>
