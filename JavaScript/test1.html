<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-1</title>
</head>
<body>
    <script>
        // Your JavaScript code here
        // document.write("Hello Students");

        //var / let /const
        var a=10;
        document.write(a);
        var s="Hello ";
        document.write(s);

        var ch=25;
        switch(ch){
            case 1:
                document.write("Monday");
                break;
            case 2:
                document.write("Tuesday");
                break;
            case 3:
                document.write("Wednesday");
                break;
            default:
                document.write("Wrong Choice<br>");
        }

        var c=1;
        while(c<=5){
            document.write(c+" ");
            c++;
        }
        document.write("<hr>");

        for(let i=1; i<=10; i++){
            document.write(i+" ");
        }
        document.write("<br>");
        document.write(i);
    </script>
</body>
</html>
